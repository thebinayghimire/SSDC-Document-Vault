{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a class="button secondary" href="?page={{ page.previous_page_number }}&amp;q={{ search|urlencode }}&amp;view={{ mode|urlencode }}&amp;sort={{ sort|urlencode }}&amp;type={{ file_type|urlencode }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary" href="?page={{ page.next_page_number }}&amp;q={{ search|urlencode }}&amp;view={{ mode|urlencode }}&amp;sort={{ sort|urlencode }}&amp;type={{ file_type|urlencode }}">Next</a>{% endif %}</nav>{% endif %}
