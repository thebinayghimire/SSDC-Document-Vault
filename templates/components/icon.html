<svg class="icon {{ class }}"
     xmlns="http://www.w3.org/2000/svg"
     width="20"
     height="20"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.7"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false">
  {% if name == "vault" %}
    <rect x="4" y="3" width="16" height="18" rx="3" /><circle cx="12" cy="12" r="4" />
    <path d="M12 8v2m0 4v2m-4-4h2m4 0h2M7 6h1" />
  {% elif name == "library" %}
    <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
  {% elif name == "folder" %}
    <path d="M3 7V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
  {% elif name == "file" %}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
    <path d="M14 2v6h6M8 13h8M8 17h5" />
  {% elif name == "image" %}
    <rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8" cy="8" r="1.5" />
    <path d="m21 15-5-5L5 21" />
  {% elif name == "manage" %}
    <path d="M4 6h16M4 12h16M4 18h16" />
    <circle cx="8" cy="6" r="2" fill="var(--color-canvas-secondary)" /><circle cx="16" cy="12" r="2" fill="var(--color-canvas-secondary)" /><circle cx="10" cy="18" r="2" fill="var(--color-canvas-secondary)" />
  {% elif name == "users" %}
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
    <circle cx="9" cy="7" r="4" />
  {% elif name == "lock" %}
    <rect x="5" y="10" width="14" height="11" rx="2" />
    <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
  {% elif name == "shield" %}
    <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z" />
    <path d="m9 12 2 2 4-4" />
  {% elif name == "search" %}
    <circle cx="10.5" cy="10.5" r="7.5" />
    <path d="m16 16 5 5" />
  {% elif name == "list" %}
    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
  {% elif name == "chevron" %}
    <path d="m9 5 7 7-7 7" />
  {% elif name == "arrow" %}
    <path d="M5 12h14m-6-6 6 6-6 6" />
  {% elif name == "back" %}
    <path d="M19 12H5m6-6-6 6 6 6" />
  {% elif name == "open" %}
    <path d="M7 17 17 7M7 7h10v10" />
  {% elif name == "plus" %}
    <path d="M12 5v14M5 12h14" />
  {% elif name == "minus" %}
    <path d="M5 12h14" />
  {% elif name == "upload" %}
    <path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" />
  {% elif name == "menu" %}
    <path d="M4 6h16M4 12h16M4 18h16" />
  {% elif name == "check" %}
    <path d="m5 12 4 4L19 6" />
  {% elif name == "info" %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 11v6M12 7h.01" />
  {% elif name == "archive" %}
    <rect x="3" y="3" width="18" height="4" rx="1" />
    <path d="M5 7v14h14V7M10 12h4" />
  {% elif name == "trash" %}
    <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" />
  {% elif name == "clipboard" %}
    <rect x="5" y="4" width="14" height="17" rx="2" /><rect x="9" y="2" width="6" height="4" rx="1" />
    <path d="M9 11h6M9 15h4" />
  {% endif %}
</svg>
