{% load i18n %}
{% get_current_language as current_language %}
<form class="language-switcher" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label for="site-language">{% translate "Language" %}</label>
  <select id="site-language" name="language" lang="en">
    <option value="en" {% if current_language == 'en' %}selected{% endif %}>English</option>
    <option value="ne" lang="ne" {% if current_language == 'ne' %}selected{% endif %}>नेपाली</option>
  </select>
  <button type="submit">{% translate "Apply" %}</button>
</form>
