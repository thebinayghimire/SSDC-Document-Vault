name: ssdc-vault-production
services:
  db:
    image: ssdc-postgres
    build: {context: ., dockerfile: deploy/Dockerfile.db}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    mem_limit: 1g
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  clamav:
    image: ssdc-clamav
    build: {context: ., dockerfile: deploy/Dockerfile.scanner}
    volumes: [clam-data:/var/lib/clamav]
    networks: [backend, updates]
    restart: unless-stopped
    mem_limit: 2g
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
  app:
    build: .
    environment:
      APP_ENV: production
      SECRET_KEY_FILE: /run/secrets/django_key
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_key
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_HOST: db
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set HTTPS origin}
      PRIVATE_STORAGE_ROOT: /data/private
      CLAMAV_HOST: clamav
      SCAN_MODE: clamav
      MFA_ALL_STAFF: ${MFA_ALL_STAFF:-0}
    secrets: [django_key, mfa_key, db_password]
    depends_on:
      db: {condition: service_healthy}
    volumes: [private-data:/data/private]
    networks: [backend, frontend]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'${HEALTHCHECK_HOST:?Set HEALTHCHECK_HOST to an allowed hostname}','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  proxy:
    image: ssdc-proxy
    build: {context: ., dockerfile: deploy/Dockerfile.proxy}
    ports: [80:8080, 443:8443]
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE}:/etc/nginx/tls/key.pem:ro
    networks: [frontend]
    depends_on: [app]
    restart: unless-stopped
    mem_limit: 128m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
secrets:
  db_password: {file: '${DB_PASSWORD_FILE:?Set DB_PASSWORD_FILE}'}
  django_key: {file: '${DJANGO_KEY_FILE:?Set DJANGO_KEY_FILE}'}
  mfa_key: {file: '${MFA_KEY_FILE:?Set MFA_KEY_FILE}'}
volumes:
  db-data:
  private-data:
  clam-data:
networks:
  backend: {internal: true}
  frontend:
  updates:
