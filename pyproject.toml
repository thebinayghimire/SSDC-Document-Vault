[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/migrations/*", "static/vendor", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
