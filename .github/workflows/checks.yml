name: Deployment checks
on: [push, pull_request, workflow_dispatch]
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ssdc_ci
          POSTGRES_USER: ssdc_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U ssdc_ci -d ssdc_ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_DB: ssdc_ci
      POSTGRES_USER: ssdc_ci
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_HOST: 127.0.0.1
      DOCUMENT_STORAGE_PROVIDER: filesystem
      SCAN_MODE: skip-development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m pytest -q --junitxml=artifacts/ci-tests.xml
      - run: python -m pip_audit -r requirements.txt
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verification, path: artifacts/}
