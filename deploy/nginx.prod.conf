limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/s;
log_format private '$request_id $remote_addr $request_method $status $body_bytes_sent $request_time';
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 26m;
    client_body_timeout 30s;
    access_log /var/log/nginx/access.log private;
    # Re-resolve the app container instead of caching its first bridge address.
    # The variable includes no URI, so sub-paths and query strings pass through.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8000;
    location / {
        limit_req zone=portal burst=60 nodelay;
        limit_req_status 429;
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }
}
