log_format private '$request_id $remote_addr $request_method $status $body_bytes_sent $request_time';
server {
    access_log /var/log/nginx/access.log private;
    listen 8080;
    server_name localhost;
    client_max_body_size 26m;
    # Resolve the app container at request time so a recreated container's new
    # bridge address is picked up without an nginx reload. The variable expands
    # to an origin with no URI, so sub-paths and query strings pass through.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8000;
    location / {
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
