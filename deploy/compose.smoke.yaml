# Localhost-only test of the production configuration; never use as deployment.
name: ssdc-vault-smoke
services:
  db:
    image: ${SMOKE_DB_IMAGE:-ssdc-postgres}
  clamav:
    image: ${SMOKE_SCANNER_IMAGE:-ssdc-clamav}
  app:
    image: ${SMOKE_APP_IMAGE:-ssdc-vault-app}
    environment:
      # This existing smoke checks HTTPS/Django with synthetic filesystem documents.
      # Drive integration has a separate mocked test suite and manual owner smoke.
      DOCUMENT_STORAGE_PROVIDER: filesystem
  migrate:
    image: ${SMOKE_APP_IMAGE:-ssdc-vault-app}
    environment:
      DOCUMENT_STORAGE_PROVIDER: filesystem
  proxy:
    image: ${SMOKE_PROXY_IMAGE:-ssdc-proxy}
    ports: !override [127.0.0.1:8081:8080, 127.0.0.1:8443:8443]
