# Standalone Supabase pilot stack. Do not merge with compose.prod.yaml.
name: ssdc-vault-pilot
services:
  clamav:
    image: ${SCANNER_IMAGE:?Set exact scanner release image reference}
    build: {context: ., dockerfile: deploy/Dockerfile.scanner}
    environment: {TZ: UTC}
    volumes: [clam-data:/var/lib/clamav]
    read_only: true
    tmpfs: ["/run/clamav:rw,noexec,nosuid,size=8m,uid=100,gid=101,mode=0770", "/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, updates]
    restart: unless-stopped
    # Signature reloads temporarily keep two engines in memory. The host needs
    # at least 8 GiB total for this ceiling plus the app and OS.
    mem_limit: 4g
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
    healthcheck:
      test: [CMD, /usr/local/bin/clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 5
      # First startup downloads signatures and can take several minutes.
      start_period: 600s
  app: &app
    image: ${APP_IMAGE:?Set exact app release image reference}
    build: .
    environment: &app_environment
      APP_ENV: production
      SECRET_KEY_FILE: /run/secrets/django_key
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_key
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set runtime role or role.project-ref}
      POSTGRES_HOST: ${POSTGRES_HOST:?Copy intended SSDC endpoint from Connect}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_CONNECTION_MODE: ${POSTGRES_CONNECTION_MODE:-session}
      POSTGRES_SSLMODE: verify-full
      POSTGRES_SSLROOTCERT: /run/secrets/postgres_root_cert
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set HTTPS origin}
      PRIVATE_STORAGE_ROOT: /data/private
      CLAMAV_HOST: clamav
      SCAN_MODE: clamav
      MFA_ALL_STAFF: ${MFA_ALL_STAFF:-0}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-10737418240}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MAX_FOLDERS: ${MAX_FOLDERS:-1000}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-300}
      LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT:-10}
      PARSER_CONCURRENCY: ${PARSER_CONCURRENCY:-1}
      SCANNER_MAX_SIGNATURE_HOURS: ${SCANNER_MAX_SIGNATURE_HOURS:-72}
      DOCUMENT_STORAGE_PROVIDER: gdrive
      GOOGLE_DRIVE_CLIENT_ID_FILE: /run/secrets/google_client_id
      GOOGLE_DRIVE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_DRIVE_CREDENTIAL_KEY_FILE: /run/secrets/google_credential_key
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:?Set exact HTTPS OAuth callback URI}
    secrets: [django_key, mfa_key, db_password, google_client_id, google_client_secret, google_credential_key, postgres_root_cert]
    depends_on:
      clamav: {condition: service_healthy}
    volumes: [private-data:/data/private]
    networks: [backend, frontend]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    cap_drop: [ALL]
    group_add: ["11001"]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1536m
    stop_grace_period: 150s
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'${HEALTHCHECK_HOST:?Set HEALTHCHECK_HOST to an allowed hostname}','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 10
  migrate:
    <<: *app
    profiles: [operations]
    environment:
      <<: *app_environment
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Set migrator role or role.project-ref}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_migration_password
    secrets: [django_key, mfa_key, db_migration_password, google_client_id, google_client_secret, google_credential_key, postgres_root_cert]
    group_add: ["11001", "11003"]
    command: [python, manage.py, migrate, --noinput]
    restart: "no"
    healthcheck: {disable: true}
  proxy:
    image: ${PROXY_IMAGE:?Set exact proxy release image reference}
    build: {context: ., dockerfile: deploy/Dockerfile.proxy}
    entrypoint: [/bin/sh, /opt/ssdc/render-proxy.sh]
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?Set canonical HTTPS hostname}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    ports: [80:8080, 443:8443]
    volumes:
      - ./deploy/nginx.prod.conf.template:/etc/nginx/templates/portal.conf.template:ro
      - ./deploy/render-proxy.sh:/opt/ssdc/render-proxy.sh:ro
      - ${TLS_DIRECTORY:?Set directory containing cert.pem and key.pem}:/etc/nginx/tls:ro
    networks: [frontend]
    depends_on: [app]
    restart: unless-stopped
    mem_limit: 128m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}
  dbtools:
    profiles: [operations]
    image: postgres:17-trixie@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
    user: "10001:10001"
    group_add: ["11001", "11003"]
    environment:
      PGHOST: ${POSTGRES_HOST:?Set SSDC host}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:?Set SSDC database}
      PGUSER: ${POSTGRES_MIGRATION_USER:?Set migrator user}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_root_cert
      PGCONNECT_TIMEOUT: "5"
    secrets: [db_migration_password, postgres_root_cert]
    entrypoint: [/bin/sh, -c, 'export PGPASSWORD="$$(cat /run/secrets/db_migration_password)"; exec "$$@"', sh]
    command: [pg_dump, --format=custom, --schema=public, --no-owner, --no-acl]
    networks: [frontend]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
secrets:
  db_migration_password: {file: '${DB_MIGRATION_PASSWORD_FILE:?Set migration password file path}'}
  db_password: {file: '${DB_PASSWORD_FILE:?Set DB_PASSWORD_FILE}'}
  django_key: {file: '${DJANGO_KEY_FILE:?Set DJANGO_KEY_FILE}'}
  mfa_key: {file: '${MFA_KEY_FILE:?Set MFA_KEY_FILE}'}
  google_client_id: {file: '${GOOGLE_DRIVE_CLIENT_ID_FILE:?Set private client ID file path}'}
  google_client_secret: {file: '${GOOGLE_DRIVE_CLIENT_SECRET_FILE:?Set private client secret file path}'}
  google_credential_key: {file: '${GOOGLE_DRIVE_CREDENTIAL_KEY_FILE:?Set separate Fernet key file path}'}
  postgres_root_cert: {file: '${POSTGRES_SSLROOTCERT_FILE:?Set verified endpoint CA bundle path}'}
volumes:
  private-data:
  clam-data:
networks:
  backend: {internal: true}
  frontend:
  updates:
